<div class="page">
  <div class="delete-vehicle-card">

    <!-- HEADER -->
    <div class="card-header">
      <h1>My Vehicles</h1>
    </div>

    <!-- LIST -->
    <div class="profile-container">
      @if (vehicles().length === 0) {
        <div class="empty">
          <p>No vehicles found</p>
        </div>
      }
      @else {
        @for (v of vehicles(); track v.vehicleId) {
          <div class="info-row">
            
            <!-- TOP SECTION: Vehicle details -->
            <div class="vehicle-info">
              <h3 class="vehicle-title">{{ v.make }} {{ v.model }}</h3>
              <p class="vehicle-meta">Year: <span>{{ v.year }}</span></p>
              <div class="reg-number-badge">{{ v.registrationNumber }}</div>
            </div>

            <!-- BOTTOM SECTION: Action buttons -->
            <div class="action-buttons">
              <!-- Un-comment if needed later, layout won't break -->
              <!-- <button type="button" class="btn-edit" [routerLink]="['/update-vehicle', v.vehicleId]">Update</button> -->
              
              @if (v.vehicleId) {
                <button type="button" class="btn-delete" (click)="deleteVehicle(v.vehicleId!)">
                  Delete Vehicle
                </button>
              }
            </div>

          </div>
        }
      }
    </div>

  </div>
</div>
