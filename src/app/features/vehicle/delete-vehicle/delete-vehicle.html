<div class="delete-vehicle-card">

  <div class="card-header">
    <h1>My Vehicles</h1>
    <p>Manage your vehicles</p>
  </div>

  <div class="profile-container">

    <div *ngFor="let v of vehicles" class="info-row">

      <div>
        <b>{{ v.make }} {{ v.model }}</b><br>
        {{ v.registrationNumber }}
      </div>

      <div>
        <button class="btn-edit" (click)="editVehicle(v.vehicleId)">
          Edit
        </button>

        <button class="btn-cancel" (click)="deleteVehicle(v.vehicleId)">
          Delete
        </button>
      </div>

    </div>

  </div>
</div>
