<div class="page-container">

  <div class="container">

    <div class="card">

      <h1>Add Vehicle</h1>
      <p class="subtitle">Enter your vehicle details</p>

      <form #vehicleForm="ngForm" (ngSubmit)="addVehicle()" novalidate>

        <!-- MAKE -->
        <div class="input-group">
          <label>Make</label>
          <input 
            type="text"
            name="make"
            [(ngModel)]="vehicle.make"
            #make="ngModel"
            placeholder="Enter brand name"
            required>

          @if (make.invalid && make.touched) {
            <small style="color:red;">Make is required</small>
          }
        </div>

        <!-- MODEL -->
        <div class="input-group">
          <label>Model</label>
          <input 
            type="text"
            name="model"
            [(ngModel)]="vehicle.model"
            #model="ngModel"
            placeholder="Enter model name"
            required>

          @if (model.invalid && model.touched) {
            <small style="color:red;">Model is required</small>
          }
        </div>

        <!-- YEAR -->
        <div class="input-group">
          <label>Year</label>
          <input 
            class="input-year"
            type="number"
            name="year"
            [(ngModel)]="vehicle.year"
            #year="ngModel"
            placeholder="YYYY"
            required
            min="1900"
            max="2099">

          @if (year.invalid && year.touched) {
            <small style="color:red;">Enter valid 4-digit year</small>
          }
        </div>

        <!-- REGISTRATION -->
        <div class="input-group">
          <label>Registration Number</label>
          <input
            class="input-reg"
            type="text"
            name="registrationNumber"
            [(ngModel)]="vehicle.registrationNumber"
            #reg="ngModel"
            placeholder="TN80CD2345"
            required
            pattern="^[A-Z]{2}[0-9]{2}[A-Z]{1,3}[0-9]{4}$">

          @if (reg.invalid && reg.touched) {
            <small style="color:red;">
              Format: TN80CD2345
            </small>
          }
        </div>

        <!-- BUTTON -->
        <button 
          type="submit" 
          class="btn"
          [disabled]="vehicleForm.invalid || isLoading">

          {{ isLoading ? 'Adding...' : 'Add Vehicle' }}
        </button>

        <p class="message">{{ message }}</p>

      </form>

    </div>

  </div>

</div>
