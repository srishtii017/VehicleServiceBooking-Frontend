<div class="booking-page">

  <div class="form-grid">
    <div class="field">
      <label>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2z"/><polyline points="3 9 12 15 21 9"/></svg>
        Vehicle Model
      </label>
      <select
        class="pill-input pill-select"
        [(ngModel)]="selectedVehicle"
        (ngModelChange)="onVehicleSelect($event)"
      >
        <option [ngValue]="undefined">— Select your vehicle —</option>
        @for (v of vehicles(); track v.vehicleId) {
          <option [ngValue]="v">{{ v.registrationNumber }}-{{ v.make }}-{{ v.model }}</option>
        }
      </select>
    </div>

    <div class="field">
      <label>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Service Date
      </label>
      <input
        class="pill-input date-input"
        name="serviceDate"
        type="date"
        required
        [(ngModel)]="selectedDate"
        (ngModelChange)="onDateTimeChange()"
      />
    </div>

    <div class="field field-full">
      <label>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Service Description
      </label>
      <input
        class="pill-input"
        type="text"
        placeholder="Describe the service you need (e.g. Oil change, AC repair, Full service...)"
        [(ngModel)]="booking.serviceType"
      />
    </div>

  </div>

  <div class="form-action">
    <button
      type="submit"
      class="btn-confirm"
      (click)="createBooking()"
      [disabled]="!isFormValid()"
    >
      Confirm Booking
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>
  </div>

</div>
