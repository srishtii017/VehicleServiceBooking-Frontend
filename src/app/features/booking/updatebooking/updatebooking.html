<div class="update-page">
  <div class="page-header">
    <h1>Update Booking</h1>
    <p>Change the service details for an existing appointment</p>
  </div>

  <form class="booking-form" (ngSubmit)="updateBooking()" #bookingForm="ngForm" novalidate>
    <div class="form-grid">
      <div class="field">
        <label>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="8" rx="2"/><circle cx="7" cy="16" r="2"/><circle cx="17" cy="16" r="2"/><path d="M7 8l2-4h6l2 4"/></svg>
          Vehicle
        </label>
          <select
          class="pill-input pill-select"
          [(ngModel)]="selectedVehicle"
          (ngModelChange)="onVehicleSelect($event)"
          name="vehicle">
          <option [ngValue]="undefined">— Select your vehicle —</option>
          @for (v of vehicles(); track v.vehicleId) {
            <option [ngValue]="v">{{ v.registrationNumber }}-{{ v.make }}-{{ v.model }}</option>
          }
        </select>
      </div>

      <div class="field">
        <label>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Service Type
        </label>
        <input
          class="pill-input"
          name="serviceType"
          type="text"
          placeholder="Describe the updated service"
          required
          [(ngModel)]="update.serviceType"
        />
      </div>

      <div class="field field-full">
        <label>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Service Date
        </label>
        <input
          class="pill-input date-input"
          name="serviceDate"
          type="date"
          required
          #sDate="ngModel"
          [(ngModel)]="update.serviceDate"
          [min]="minServiceDate"
        />
        @if (sDate.invalid && sDate.touched) {
          <small style="color: #ff4d4d; font-size: 12px; margin-top: 5px; display: block;">
            @if (sDate.errors?.['required']) {
              Service date is required.
            }
          </small>
        }
      </div>
    </div>

    <div class="form-action">
      <button type="submit" class="btn-update" [disabled]="bookingForm.invalid">
        Update Booking
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>
      </button>
    </div>
  </form>
</div>
