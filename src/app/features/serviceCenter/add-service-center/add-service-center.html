<div class="page-container">
  <!-- Left side: Add Service Center form -->
  <div class="left-section">
    <div class="center-card">
      <h2 class="center-name">Add Service Center</h2>

      <form #centerForm="ngForm" (ngSubmit)="onSubmit()" class="center-form">

        <label class="form-label">Center Name</label>
        <input [(ngModel)]="center.centerName" name="centerName" class="form-input" placeholder="Enter center name" required />

        <label class="form-label">Flat Number</label>
        <input [(ngModel)]="center.flatNumber" name="flatNumber" class="form-input" placeholder="Flat / Door No." required />

        <!-- ✅ Street + Nearest Landmark in one row -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Street</label>
            <input [(ngModel)]="center.street" name="street" class="form-input" placeholder="Street name" required />
          </div>
          <div class="form-group">
            <label class="form-label">Nearest Landmark</label>
            <input [(ngModel)]="center.nearestLandmark" name="nearestLandmark" class="form-input" placeholder="Nearby landmark" required />
          </div>
        </div>

        <!-- ✅ City + State in one row -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">City</label>
            <input [(ngModel)]="center.city" name="city" class="form-input" placeholder="City" required />
          </div>
          <div class="form-group">
            <label class="form-label">State</label>
            <input [(ngModel)]="center.state" name="state" class="form-input" placeholder="State" required />
          </div>
        </div>

        <label class="form-label">Pincode</label>
        <input [(ngModel)]="center.pincode" name="pincode" class="form-input" placeholder="6-digit pincode" required pattern="^\d{6}$" />

        <label class="form-label">Contact Number</label>
        <input [(ngModel)]="center.contact" name="contact" class="form-input" placeholder="10-digit mobile number" required pattern="^\d{10}$" />

        <label class="form-label">Service Description</label>
        <textarea [(ngModel)]="center.serviceDescription" name="serviceDescription" class="form-input" placeholder="Services you provide" required></textarea>

        <label class="form-label">Capacity</label>
        <input type="number" [(ngModel)]="center.capacity" name="capacity" class="form-input" placeholder="Capacity (1-500)" required min="1" max="500" />

        <button type="submit" class="details-btn" >
          Add Center
        </button>
      </form>
    </div>
  </div>

  <!-- Right side: background image only -->
  <div class="right-section"></div>
</div>
