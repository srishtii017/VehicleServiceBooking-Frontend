<div class="main-card">
  <!-- Top Header Section -->
  <div class="card-header">
    <h1>Welcome Back</h1>
    <p>Please login with your credentials</p>
  </div>

  <div class="container">
    <div class="login-box">
      <h2>Owner Login</h2>
      <form (ngSubmit)="HandleLogin()">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="Email" [(ngModel)]="login.Email" placeholder="example@mail.com" required maxlength="150">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="Password" [(ngModel)]="login.Password" placeholder="Enter your password" required maxlength="256">
        </div>
        <button type="submit">Login</button>
      </form>

      <div class="links">
        <p>Don't have an account? <a class="Link" routerLink="/register">Register</a></p>
        <p><a >Forgot Password?</a></p>
      </div>
    </div>

    <div class="image-box">
      <img src="assets/service-center.png" alt="Service Center">
    </div>
  </div>
</div>
