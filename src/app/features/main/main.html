<div class="main-container">

  <div class="main-card">

    <!-- Left Content -->
    <div class="left-section">
      <h1>Vehicle Service</h1>
      <p class="subtitle">Welcome, {{ userName }}</p>

      <div class="btn-group">
        <button (click)="addVehicle()">Add Vehicle</button>
        <button (click)="createBooking()">Create Booking</button>
        <button (click)="myBookings()">My Booking</button>
        <button (click)="myVehicles()">My Vehicles</button>
      </div>
    </div>

    <!-- Right Image -->
    <div class="right-section">
      <img src="https://images.unsplash.com/photo-1605559424843-9e4c228bf1c2?auto=format&fit=crop&w=600&q=80" />
    </div>

  </div>

</div>
