<div class="main-card">
  <div class="card-header">
    <h1>🚗 Vehicle Service</h1>
    <p>Please select how you want to continue</p>
  </div>

  <div class="role-options">

    <div class="role-box" (click)="goToUser()">
      <span class="role-icon">👤</span>
      <h3>I'm a Customer</h3>
      <p>Book services, track vehicles, manage invoices</p>
    </div>

    <div class="role-box" (click)="goToOwner()">
      <span class="role-icon">🏪</span>
      <h3>I'm a Service Owner</h3>
      <p>Manage your service center and bookings</p>
    </div>

  </div>
</div>
