<div class="main-card">
  <div class="card-header">
    <h1>Vehicle Service</h1>
    <p>Create your account to get started</p>
  </div>

  <div class="container">
    <div class="register-box">
      <h2>Customer Register</h2>

      <form (ngSubmit)="onRegister()" #registerForm="ngForm">

        <!-- Name -->
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="name"
            [(ngModel)]="registerData.name"
            required minlength="2" maxlength="100"
            placeholder="Enter your full name" />
        </div>

        <!-- Email -->
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email"
            [(ngModel)]="registerData.email"
            required
            placeholder="Enter your email" />
        </div>

        <!-- Phone -->
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" name="phone"
            [(ngModel)]="registerData.phone"
            required minlength="10" maxlength="13"
            placeholder="Enter your phone number" />
        </div>

        <!-- Flat Number -->
        <div class="form-group">
          <label>Flat / House No</label>
          <input type="text" name="flatNumber"
            [(ngModel)]="registerData.flatNumber"
            required
            placeholder="Flat / House number" />
        </div>

        <!-- Street -->
        <div class="form-group">
          <label>Street</label>
          <input type="text" name="street"
            [(ngModel)]="registerData.street"
            required
            placeholder="Street name" />
        </div>

        <!-- Landmark -->
        <div class="form-group">
          <label>Landmark (Optional)</label>
          <input type="text" name="landmark"
            [(ngModel)]="registerData.landmark"
            placeholder="Nearby landmark" />
        </div>

        <!-- City -->
        <div class="form-group">
          <label>City</label>
          <input type="text" name="city"
            [(ngModel)]="registerData.city"
            required
            placeholder="City" />
        </div>

        <!-- State -->
        <div class="form-group">
          <label>State</label>
          <input type="text" name="state"
            [(ngModel)]="registerData.state"
            required
            placeholder="State" />
        </div>

        <!-- Pincode -->
        <div class="form-group">
          <label>Pincode</label>
          <input type="text" name="pincode"
            [(ngModel)]="registerData.pincode"
            required minlength="6" maxlength="6"
            placeholder="6-digit pincode" />
        </div>

        <!-- Password -->
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password"
            [(ngModel)]="registerData.password"
            required minlength="6"
            placeholder="Minimum 6 characters" />
        </div>

        <button type="submit" [disabled]="registerForm.invalid || isLoading">
          {{ isLoading ? 'Creating account...' : 'Register' }}
        </button>

      </form>

      <div class="links">
        <p>Already have an account?
          <a (click)="goToLogin()" class="Link">Login here</a>
        </p>
      </div>
    </div>

    <div class="image-box">
      <img src="assets/service-center.png" alt="Service Center" />
    </div>
  </div>
</div>
