<div class="main-card">
  <div class="card-header">
    <h1>Vehicle Service</h1>
    <p>Create your account to get started</p>
  </div>

  <div class="container">

    <!-- LEFT FORM -->
    <div class="register-box">
      <h2>Customer Register</h2>

      <form (ngSubmit)="onRegister()" #registerForm="ngForm">

        <div class="grid">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name"
              [(ngModel)]="registerData.name"
              placeholder="Full name" required>
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" name="email"
              [(ngModel)]="registerData.email"
              placeholder="Email" required>
          </div>

          <div class="form-group">
            <label>Phone</label>
            <input type="tel" name="phone"
              [(ngModel)]="registerData.phone"
              placeholder="Phone">
          </div>

          <div class="form-group">
            <label>Password</label>
            <input type="password" name="password"
              [(ngModel)]="registerData.password"
              placeholder="Password">
          </div>

          <div class="form-group">
            <label>Flat / House No</label>
            <input type="text" name="flatNumber"
              [(ngModel)]="registerData.flatNumber"
              placeholder="Flat">
          </div>

          <div class="form-group">
            <label>Street</label>
            <input type="text" name="street"
              [(ngModel)]="registerData.street"
              placeholder="Street">
          </div>

          <div class="form-group">
            <label>Landmark</label>
            <input type="text" name="landmark"
              [(ngModel)]="registerData.landmark"
              placeholder="Optional">
          </div>

          <div class="form-group">
            <label>City</label>
            <input type="text" name="city"
              [(ngModel)]="registerData.city"
              placeholder="City">
          </div>

          <div class="form-group">
            <label>State</label>
            <input type="text" name="state"
              [(ngModel)]="registerData.state"
              placeholder="State">
          </div>

          <div class="form-group">
            <label>Pincode</label>
            <input type="text" name="pincode"
              [(ngModel)]="registerData.pincode"
              placeholder="Pincode">
          </div>
        </div>

        <button type="submit">Register</button>
      </form>

      <div class="links">
        <p>Already have an account?
          <span (click)="goToLogin()" class="Link">Login</span>
        </p>
      </div>
    </div>

    <!-- RIGHT IMAGE -->
    <div class="image-box">
      <img src="assets/service-center.png" alt="service">
    </div>

  </div>
</div>
