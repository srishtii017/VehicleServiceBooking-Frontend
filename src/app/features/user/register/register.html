<div class="main-card">
  <div class="card-header">
    <h1>Vehicle Service</h1>
    <p>Create your account to get started</p>
  </div>

  <div class="container">
    <div class="register-box">
      <h2>Customer Register</h2>

      <div class="alert-error">{{ errorMessage }}</div>
      <div class="alert-success">{{ successMessage }}</div>

      <form (ngSubmit)="onRegister()" #registerForm="ngForm">

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="name"
            [(ngModel)]="registerData.name"
            required minlength="2" maxlength="100"
            placeholder="Enter your full name" />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email"
            [(ngModel)]="registerData.email"
            required
            placeholder="Enter your email" />
        </div>

        <div class="form-group">
          <label>Phone</label>
          <input type="tel" name="phone"
            [(ngModel)]="registerData.phone"
            required minlength="10" maxlength="13"
            placeholder="Enter your phone number" />
        </div>

        <div class="form-group">
          <label>Address</label>
          <textarea name="address"
            [(ngModel)]="registerData.address"
            required maxlength="500"
            placeholder="Enter your address"
            rows="3"></textarea>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password"
            [(ngModel)]="registerData.password"
            required minlength="6"
            placeholder="Minimum 6 characters" />
        </div>

        <button type="submit" [disabled]="registerForm.invalid || isLoading">
          {{ isLoading ? 'Creating account...' : 'Register' }}
        </button>

      </form>

      <div class="links">
        <p>Already have an account?
          <a (click)="goToLogin()" class="Link">Login here</a>
        </p>
      </div>
    </div>

    <div class="image-box">
      <img src="assets/service-center.png" alt="Service Center" />
    </div>
  </div>
</div>
