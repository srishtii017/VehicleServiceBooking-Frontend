<div style="max-width: 400px; margin: 40px auto; padding: 30px; border: 1px solid #dee2e6; border-radius: 8px; box-shadow: var(--card-shadow);">
<h2 style="color: var(--primary-color); margin-bottom: 20px;">Account Login</h2>
<div style="margin-bottom: 15px;">
<label style="display: block; margin-bottom: 5px; font-weight: bold;">Employee/User ID</label>
<input type="text" placeholder="Enter your ID" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
</div>
<div style="margin-bottom: 20px;">
<label style="display: block; margin-bottom: 5px; font-weight: bold;">Password</label>
<input type="password" placeholder="Enter password" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
</div>
<button style="width: 100%; padding: 12px; background-color: var(--primary-color); color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
   Sign In
</button>
</div>
