<div class="main-card">
  <div class="card-header">
    <h1>Vehicle Service</h1>
    <p>Welcome back! Please login to continue</p>
  </div>

  <div class="container">
    <div class="login-box">
      <h2>Customer Login</h2>

      <form (ngSubmit)="onLogin(loginForm)" #loginForm="ngForm">

        <!-- EMAIL -->
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="loginData.email"
            #email="ngModel"
            required
            email
            placeholder="Enter your email"
          />

          <div *ngIf="email.invalid && (email.touched || email.dirty)">
            <small style="color:red;" *ngIf="email.errors?.['required']">
              Email is required
            </small>
            <small style="color:red;" *ngIf="email.errors?.['email']">
              Invalid email format
            </small>
          </div>
        </div>

        <!-- PASSWORD -->
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="loginData.password"
            #password="ngModel"
            required
            minlength="6"
            placeholder="Enter your password"
          />

          <div *ngIf="password.invalid && (password.touched || password.dirty)">
            <small style="color:red;" *ngIf="password.errors?.['required']">
              Password is required
            </small>
            <small style="color:red;" *ngIf="password.errors?.['minlength']">
              Password must be at least 6 characters
            </small>
          </div>
        </div>

        <!-- BUTTON -->
        <button type="submit" [disabled]="loginForm.invalid || isLoading">
          {{ isLoading ? 'Logging in...' : 'Login' }}
        </button>

      </form>

      <!-- SUCCESS -->
      <div *ngIf="successMessage" style="color:green;">
        {{ successMessage }}
      </div>

      <div class="links">
        <p>
          Don't have an account?
          <a (click)="goToRegister()" class="Link">Register here</a>
        </p>
      </div>
    </div>

    <!-- ✅ YOUR IMAGE (KEPT) -->
    <div class="image-box">
      <img src="assets/service-center.png" alt="Service Center" />
    </div>

  </div>
</div>
