<div class="profile-page">

  <div class="profile-banner"></div>

  <div class="profile-content">

    <div class="profile-card">

     
      <div class="profile-header">
        <h1>My Profile</h1>

        <div class="action-buttons">

          <button class="btn-edit" (click)="toggleEdit()">
            {{ isEditing ? 'Cancel Edit' : 'Edit Profile' }}
          </button>

          <button class="btn-password" (click)="goToChangePassword()">
            Change Password
          </button>

        </div>
      </div>

      <p class="subtitle">View and manage your personal details</p>

      
      <div *ngIf="user as u; else loadingBlock">

    
        <div *ngIf="!isEditing" class="profile-grid">

          <div class="form-group">
            <label>Full Name</label>
            <input [value]="u.name" disabled>
          </div>

          <div class="form-group">
            <label>Email</label>
            <input [value]="u.email" disabled>
          </div>

          <div class="form-group">
            <label>Phone</label>
            <input [value]="u.phone" disabled>
          </div>

          <div class="form-group">
            <label>Flat / House No</label>
            <input [value]="u.flatNumber" disabled>
          </div>

          <div class="form-group">
            <label>Street</label>
            <input [value]="u.street" disabled>
          </div>

          <div class="form-group">
            <label>Landmark</label>
            <input [value]="u.landmark" disabled>
          </div>

          <div class="form-group">
            <label>City</label>
            <input [value]="u.city" disabled>
          </div>

          <div class="form-group">
            <label>State</label>
            <input [value]="u.state" disabled>
          </div>

          <div class="form-group">
            <label>Pincode</label>
            <input [value]="u.pincode" disabled>
          </div>

        </div>

  
        <form *ngIf="isEditing"
              class="profile-grid"
              (ngSubmit)="onUpdate()"
              #form="ngForm">

          <div class="form-group">
            <label>Full Name</label>
            <input name="name" [(ngModel)]="updateData.name" required>
          </div>

          <div class="form-group">
            <label>Phone</label>
            <input name="phone" [(ngModel)]="updateData.phone">
          </div>

          <div class="form-group">
            <label>Flat / House No</label>
            <input name="flatNumber" [(ngModel)]="updateData.flatNumber">
          </div>

          <div class="form-group">
            <label>Street</label>
            <input name="street" [(ngModel)]="updateData.street">
          </div>

          <div class="form-group">
            <label>Landmark</label>
            <input name="landmark" [(ngModel)]="updateData.landmark">
          </div>

          <div class="form-group">
            <label>City</label>
            <input name="city" [(ngModel)]="updateData.city">
          </div>

          <div class="form-group">
            <label>State</label>
            <input name="state" [(ngModel)]="updateData.state">
          </div>

          <div class="form-group">
            <label>Pincode</label>
            <input name="pincode" [(ngModel)]="updateData.pincode">
          </div>

          <div class="full-width">
            <button class="btn-save" type="submit">
              Save Changes
            </button>
          </div>

        </form>

      </div>

      
      <ng-template #loadingBlock>
        <div class="loading-text">
          Loading profile...
        </div>
      </ng-template>

    </div>
  </div>
</div>
