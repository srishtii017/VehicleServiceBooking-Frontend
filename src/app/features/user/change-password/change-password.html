<div class="profile-page">

  <div class="profile-banner"></div>

  <div class="profile-content">

    <div class="profile-card">

      <div class="profile-header">
        <h1>Change Password</h1>
      </div>

      <p class="subtitle">Keep your account secure</p>

      <div class="alert-error">{{ errorMessage }}</div>
      <div class="alert-success">{{ successMessage }}</div>

      <form (ngSubmit)="onChangePassword()" #changeForm="ngForm">

        <div class="form-group">
          <label>Current Password</label>
          <input type="password" name="currentPassword"
            [(ngModel)]="passwordData.currentPassword"
            required placeholder="Enter current password" />
        </div>

        <div class="form-group">
          <label>New Password</label>
          <input type="password" name="newPassword"
            [(ngModel)]="passwordData.newPassword"
            required minlength="6" />
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" name="confirmPassword"
            [(ngModel)]="passwordData.confirmPassword"
            required />
        </div>

        <div class="btn-group">
          <button type="submit"
            [disabled]="changeForm.invalid || passwordData.newPassword !== passwordData.confirmPassword">
            Change Password
          </button>

          <button type="button" class="btn-cancel" (click)="goToProfile()">
            Cancel
          </button>
        </div>

      </form>

    </div>
  </div>
</div>
