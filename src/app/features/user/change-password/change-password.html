<div class="main-card">
  <div class="card-header">
    <h1>Vehicle Service</h1>
    <p>Keep your account secure</p>
  </div>

  <div class="password-container">

    <div class="alert-error">{{ errorMessage }}</div>
    <div class="alert-success">{{ successMessage }}</div>

    <form (ngSubmit)="onChangePassword()" #changeForm="ngForm">

      <div class="form-group">
        <label>Current Password</label>
        <input type="password" name="currentPassword"
          [(ngModel)]="passwordData.currentPassword"
          required
          placeholder="Enter current password" />
      </div>

      <div class="form-group">
        <label>New Password</label>
        <input type="password" name="newPassword"
          [(ngModel)]="passwordData.newPassword"
          required minlength="6"
          placeholder="Minimum 6 characters" />
      </div>

      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" name="confirmPassword"
          [(ngModel)]="passwordData.confirmPassword"
          required
          placeholder="Re-enter new password" />
      </div>

      <div class="btn-group">
        <button type="submit"
          [disabled]="changeForm.invalid || isLoading || passwordData.newPassword !== passwordData.confirmPassword">
          {{ isLoading ? 'Changing...' : 'Change Password' }}
        </button>
        <button type="button" class="btn-cancel" (click)="goToProfile()">Cancel</button>
      </div>

    </form>
  </div>
</div>
